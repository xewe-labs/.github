<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">xewe-os ecosystem</title>
<desc id="desc">From the top, xewe-os-core (the XeWeCore library), xewe-os-modules (validated, tested modules) and your custom project-local modules in src/ flow into xewe-os, the template; xewe-os-tools (the xewe CLI) enters from the side. xewe-led-os and xewe-chill-os are built on xewe-os.</desc>
